<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wallps — different wallpapers for desktop &amp; lock screen</title>
  <meta name="description" content="Different wallpapers for desktop and lock screen on macOS 13+. Free and open source.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='8' y='8' width='84' height='84' rx='22' fill='%23fafafa'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #09090b;
      color: #fafafa;
      font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(640px 320px at 50% -8%, rgba(255, 255, 255, 0.09), transparent 70%),
        radial-gradient(circle at center, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: auto, 26px 26px;
      mask-image: radial-gradient(720px 480px at 50% 38%, black 30%, transparent 100%);
      -webkit-mask-image: radial-gradient(720px 480px at 50% 38%, black 30%, transparent 100%);
    }

    main {
      position: relative;
      text-align: center;
      padding: 48px 24px;
    }

    main > * {
      opacity: 0;
      animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    main > *:nth-child(1) { animation-delay: 0.05s; }
    main > *:nth-child(2) { animation-delay: 0.15s; }
    main > *:nth-child(3) { animation-delay: 0.25s; }
    main > *:nth-child(4) { animation-delay: 0.35s; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.24em;
      color: #71717a;
    }
    .status::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }

    h1 {
      margin-top: 26px;
      font-size: clamp(29px, 5.2vw, 50px);
      font-weight: 500;
      letter-spacing: -0.04em;
      line-height: 1.18;
    }
    h1 .dim { color: #52525b; }

    .sub {
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.75;
      color: #a1a1aa;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      margin-top: 40px;
      padding: 14px 28px;
      border-radius: 999px;
      background: #fafafa;
      color: #09090b;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: -0.01em;
      transition: transform 200ms cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 200ms cubic-bezier(0.16, 1, 0.3, 1);
    }
    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 34px rgba(255, 255, 255, 0.16);
    }
    .button:active { transform: translateY(0); box-shadow: none; }
    .button svg { width: 15px; height: 15px; fill: currentColor; flex: none; }

    .meta {
      margin-top: 30px;
      font-size: 12px;
      color: #71717a;
    }
    .meta a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid #3f3f46;
      padding-bottom: 1px;
      transition: color 150ms ease, border-color 150ms ease;
    }
    .meta a:hover { color: #fafafa; border-color: #fafafa; }

    @media (prefers-reduced-motion: reduce) {
      main > * { animation: none; opacity: 1; }
      .button { transition: none; }
    }

    ::selection { background: rgba(255, 255, 255, 0.18); }
  </style>
</head>
<body>
  <main>
    <p class="status">WALLPS&nbsp;&nbsp;/&nbsp;&nbsp;FOR MACOS</p>
    <h1>Different wallpapers<br>for desktop <span class="dim">&amp;</span> lock screen.</h1>
    <p class="sub">Pick two images. Wallps keeps them apart —<br>zero flash, every time you lock.</p>

    <p class="meta">macOS 13+ &middot; Free &middot; Open source &middot; <a href="https://github.com/DeepanshuMishraa/wallps">GitHub</a></p>
  </main>
</body>
</html>
